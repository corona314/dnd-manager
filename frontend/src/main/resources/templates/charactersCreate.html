<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Personajes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #111;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        h2 {
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        form {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .character-card {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<header>
    Gestor de Personajes
</header>

<div class="container">

    <h2>Crear personaje</h2>

    <form th:action="@{/characters/save}" method="post" th:object="${character}">

        <label>Usuario ID</label>
        <input type="number" th:field="*{user_id}" required>

        <label>Nombre</label>
        <input type="text" th:field="*{name}" required>

        <label>Nivel</label>
        <input type="number" th:field="*{level}" min="1" max="20" required>

        <label>HP máximo</label>
        <input type="number" th:field="*{max_hp}" required>

        <label>HP actual</label>
        <input type="number" th:field="*{current_hp}" required>

        <label>Velocidad</label>
        <input type="number" th:field="*{speed}" required>

        <label>Especie ID</label>
        <input type="number" th:field="*{specie_id}" required>

        <label>Clase ID</label>
        <input type="number" th:field="*{class_id}" required>

        <label>Subclase ID</label>
        <input type="number" th:field="*{subclass_id}">

        <button type="submit">Guardar personaje</button>
    </form>

    <h2>Personajes guardados</h2>

    <div th:if="${#lists.isEmpty(characters)}">
        No hay personajes aún.
    </div>

    <div th:each="c : ${characters}" class="character-card">
        <strong th:text="${c.name}"></strong><br>
        Usuario: <span th:text="${c.user_id}"></span><br>
        Nivel: <span th:text="${c.level}"></span><br>
        HP: <span th:text="${c.current_hp}"></span> /
        <span th:text="${c.max_hp}"></span><br>
        Velocidad: <span th:text="${c.speed}"></span><br>
        Especie ID: <span th:text="${c.specie_id}"></span><br>
        Clase ID: <span th:text="${c.class_id}"></span><br>
        Subclase ID: <span th:text="${c.subclass_id}"></span>
    </div>

</div>

</body>
</html>
