<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Personajes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #111;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        h2 {
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        form {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .character-card {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<header>
    Gestor de Personajes
</header>

<div class="container">

    <!-- FORMULARIO CREAR PERSONAJE -->
    <h2>Crear personaje</h2>

    <form th:action="@{/characters/save}" method="post" th:object="${character}">
        <label>Nombre</label>
        <input type="text" th:field="*{name}" required>

        <label>Raza</label>
        <input type="text" th:field="*{race}" required>

        <label>Clase</label>
        <input type="text" th:field="*{characterClass}" required>

        <label>Nivel</label>
        <input type="number" th:field="*{level}" min="1" max="20" required>

        <button type="submit">Guardar personaje</button>
    </form>

    <!-- LISTA DE PERSONAJES -->
    <h2>Personajes guardados</h2>

    <div th:if="${#lists.isEmpty(characters)}">
        No hay personajes aún.
    </div>

    <div th:each="c : ${characters}" class="character-card">
        <strong th:text="${c.name}"></strong><br>
        Raza: <span th:text="${c.race}"></span><br>
        Clase: <span th:text="${c.characterClass}"></span><br>
        Nivel: <span th:text="${c.level}"></span>
    </div>

</div>

</body>
</html>
