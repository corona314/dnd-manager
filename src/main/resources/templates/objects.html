<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Objetos</title>
</head>
<body>
<h1>Objetos</h1>
<a th:href="@{/objects/new}">Nuevo objeto</a>
<table>
    <thead>
    <tr><th>ID</th><th>Nombre</th><th>Peso</th><th>Precio</th><th>Tipo</th><th>Magia</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="obj: ${objects}">
        <td th:text="${obj.id}"></td>
        <td th:text="${obj.name}"></td>
        <td th:text="${obj.weight}"></td>
        <td th:text="${obj.price}"></td>
        <td th:text="${obj.objectType != null ? obj.objectType.name : 'N/A'}" />
        <td th:text="${obj.magic}"></td>
        <td>
            <form th:action="@{'/objects/' + ${obj.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
