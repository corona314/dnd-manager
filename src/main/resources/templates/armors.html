<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Armaduras</title>
</head>
<body>
<h1>Armaduras</h1>
<a th:href="@{/armors/new}">Nueva armadura</a>
<table>
    <thead>
    <tr><th>ID Objeto</th><th>AC Base</th><th>AC Max</th><th>Str Min</th><th>Stealth</th><th>Tipo</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="armor : ${armors}">
        <td th:text="${armor.objectId}"></td>
        <td th:text="${armor.acBase}"></td>
        <td th:text="${armor.acMax}"></td>
        <td th:text="${armor.strMin}"></td>
        <td th:text="${armor.stealthDis}"></td>
        <td th:text="${armor.armorType != null ? armor.armorType.name : 'N/A'}"></td>
        <td>
            <form th:action="@{'/armors/' + ${armor.objectId} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
