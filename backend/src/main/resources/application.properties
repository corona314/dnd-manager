spring.application.name=dnd-manager


# local DB configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DnDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:local-dev-secret-not-for-production-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}